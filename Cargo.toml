[package]
name = "neural-mesh"
version = "0.1.0"
edition = "2024"

[features]
# These four crates are kept but do not compile on Windows/GNU (upstream bugs):
#   concision-snn: imports undeclared crate `concision`
#   sc_neurocore_engine: pyo3/numpy API mismatch (into_pyarray)
#   sklears-neural (sklears-core): missing winapi features + cfg-gated method
#   tenflowers-neural (tenflowers-core): windows_sys BOOL import removed
# Enable with `--features upstream-broken` once fixed upstream.
# Real (precomputed, local-fixture) embeddings in src/embedding.rs. No dependencies; off by default.
real-embed = []
upstream-broken = ["dep:concision-snn", "dep:sc_neurocore_engine", "dep:sklears-neural", "dep:tenflowers-neural"]

[dependencies]
axicor-compute = { version = "0.1.0", features = ["mock-gpu"] }
axicor-core = "0.1.0"
axon-encoder = "0.5.0"
concision-snn = { version = "0.2.8", optional = true }
ferromorphic = "0.23.2"
hatcher-neural = "1.0.0"
hnsw_rs = "0.3.4"
limbic-critic = "0.3.0"
myelin-accelerator = "0.2.0"
native_neural_network = "0.3.1"
neural = "0.4.0"
neural-shared = "0.1.0"
neuralos-snn = "0.1.0-alpha.8"
neuromod = "0.7.0"
nir-rs = "0.4.4"
omega-snn = "1.1.0"
oxicuda-snn = "0.5.5"
oximedia-neural = "0.2.1"
petgraph = "0.8"
plasticity-lab = "0.2.1"
rayon = "1.12.0"
ruv-fann = "0.2.1"
ruv-neural-core = "0.1.0"
ruv-neural-graph = "0.1.0"
ruv-neural-mincut = "0.1.0"
ruv-neural-signal = "0.1.0"
sc_neurocore_engine = { version = "3.16.0", default-features = false, optional = true }
scirs2-neural = "0.6.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
silicon-bridge = "0.3.0"
sklears-neural = { version = "0.2.0", optional = true }
synaptic-neural-mesh = "0.1.0"
synaptic-neural-wasm = "0.1.0"
tenflowers-neural = { version = "0.2.0", optional = true }
thermogram = "1.1.0"
turbovec = "1.0.0"

# no_std WebAssembly crate: only builds for wasm32 targets
[target.'cfg(target_arch = "wasm32")'.dependencies]
micro-hnsw-wasm = "2.3.0"

# R4: vendored copy of hnsw_rs 0.3.4 with a one-line fix (reverse edges were written at the new point top level instead of the loop layer; ~1% of stored items were unfindable). See results/g17_board_entry.md.
[patch.crates-io]
hnsw_rs = { path = "vendor_g17/hnsw_rs_patched" }
