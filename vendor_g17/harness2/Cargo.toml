[package]
name = "h15_harness2"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
hnsw_exp = { package = "hnsw_rs", path = "../hnsw_rs_exp" }

[profile.release]
opt-level = 3
debug = false

[[bin]]
name = "h15_find"
path = "src/find.rs"

[[bin]]
name = "h15_trace"
path = "src/trace.rs"

[[bin]]
name = "h15_anal"
path = "src/anal.rs"

[[bin]]
name = "h15_force"
path = "src/force.rs"

[[bin]]
name = "h15_grid"
path = "src/grid.rs"

[[bin]]
name = "h15_audit"
path = "src/audit.rs"

[[bin]]
name = "h15_cmp"
path = "src/cmp.rs"

[[bin]]
name = "h15_wk"
path = "src/wk.rs"
