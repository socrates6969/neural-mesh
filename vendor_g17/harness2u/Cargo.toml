[package]
name = "h15u_harness2u"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
hnsw_exp = { package = "hnsw_rs", path = "../hnsw_rs_exp_unp" }

[profile.release]
opt-level = 3
debug = false

[[bin]]
name = "h15u_find"
path = "src/find.rs"

[[bin]]
name = "h15u_trace"
path = "src/trace.rs"

[[bin]]
name = "h15u_anal"
path = "src/anal.rs"

[[bin]]
name = "h15u_force"
path = "src/force.rs"

[[bin]]
name = "h15u_grid"
path = "src/grid.rs"

[[bin]]
name = "h15u_audit"
path = "src/audit.rs"
